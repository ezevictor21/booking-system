{% extends "base.html" %}
{% block title %}Booking{% endblock %}
{% block content %}

<div class="page-banner">
    <h1>Book Your Journey</h1>
</div>

<div class="container">
    <form method="post" action="{{ url_for('booking') }}">
        <input name="full_name" type="text" placeholder="Full Name" maxlength="100" required
               value="{{ form.get('full_name', current_user.full_name if current_user else '') }}">
        <input name="email_address" type="email" placeholder="Email Address" maxlength="120" required
               value="{{ form.get('email_address', current_user.email if current_user else '') }}">
        <input name =returning_date type="date" placeholder="Returning Date" value="{{ form.get('returning_date', '') }}">
        <input name =number_of family_members type="number" placeholder="Number of Family Members" min="30" value="{{ form.get('number_of_family_members', '0') }}">
       <input name="phone_number" type="tel" placeholder="Phone Number" maxlength="30"
               value="{{ form.get('phone_number', '') }}">
        <select name="booking_option" required>
            <option value="">Select Service</option>
            {% for service in services %}
                <option value="{{ service }}" {% if form.get('booking_option') == service %}selected{% endif %}>{{ service }}</option>
            {% endfor %}
        </select>
        <input type="date" name="travel_date" required value="{{ form.get('travel_date', '') }}">
        <input type="time" name="travel_time" required value="{{ form.get('travel_time', '') }}">
        <input type="date" name="return_date" value="{{ form.get('return_date', '') }}">
        <input type="time" name="return_time" value="{{ form.get('return_time', '') }}">
        <input type="number" name="family_members" placeholder="Number of Family Members" min="0" required
               value="{{ form.get('family_members', '0') }}">


        <input type="number" name="number_of_passengers" placeholder="Number of Passengers" min="1" required
               value="{{ form.get('number_of_passengers', '1') }}">
        <textarea name="additional_information" rows="5" placeholder="Additional Information" maxlength="500">{{ form.get('additional_information', '') }}</textarea>
        <button type="submit">Submit Booking</button>
    </form>
</div>

{% endblock %}
